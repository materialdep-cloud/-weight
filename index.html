<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重量扣重計算器</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Card active and error dynamic status styles */
        .card-active {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
            box-shadow: 0 4px 14px -2px rgba(34, 197, 94, 0.18);
        }
        .card-error {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            box-shadow: 0 4px 14px -2px rgba(239, 68, 68, 0.18);
        }
    </style>
</head>
<body class="min-h-full flex flex-col text-slate-800 pb-28">

    <!-- Header Bar -->
    <header class="bg-gradient-to-r from-emerald-800 via-green-700 to-teal-800 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-3">
                <span class="text-2xl sm:text-3xl">📦</span>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-wide">重量扣重計算</h1>
                    <p class="text-xs text-emerald-200">快速實秤淨重算牌系統</p>
                </div>
            </div>

            <button onclick="toggleSummaryModal()" class="px-3 py-1.5 bg-emerald-900/60 hover:bg-emerald-900 text-emerald-100 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-1.5 border border-emerald-500/30">
                <i class="fa-solid fa-chart-pie"></i>
                <span>已填報表 (<span id="activeCountBadge">0</span>)</span>
            </button>
        </div>
    </header>

    <!-- External Quick Links Navigation -->
    <nav class="bg-white border-b border-slate-200 py-2.5 px-4 shadow-xs">
        <div class="max-w-5xl mx-auto flex items-center justify-center gap-3 flex-wrap text-sm">
            <a href="https://materialdep-cloud.github.io/lettuce-calculator/" 
               target="_blank" 
               class="flex items-center gap-2 px-4 py-2 bg-amber-800 hover:bg-amber-900 text-white font-medium rounded-xl shadow-xs transition active:scale-95">
                <span>🌱</span> 邱薏芬(土耕) <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-70"></i>
            </a>

            <a href="https://materialdep-cloud.github.io/lettuce-calculator_-1/" 
               target="_blank" 
               class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-xs transition active:scale-95">
                <span>💧</span> 川聖(水耕) <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-70"></i>
            </a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto px-3 sm:px-4 mt-4 w-full flex-grow">

        <!-- Search and Quick Filter Bar -->
        <div class="bg-white rounded-2xl p-3 sm:p-4 shadow-xs border border-slate-200/80 mb-4 flex flex-col sm:flex-row gap-3 items-center justify-between">
            
            <!-- Search Bar Input -->
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input id="search" 
                       type="text" 
                       placeholder="🔍 搜尋品名 (例如: 蘿美, 美生菜)..." 
                       class="w-full pl-10 pr-9 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
                       oninput="render()">
                <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <!-- Action Filters -->
            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                <div class="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-medium text-slate-600 border border-slate-200">
                    <button id="filterAllBtn" onclick="setFilter('all')" class="px-3 py-1.5 rounded-lg bg-white text-slate-800 shadow-xs font-semibold transition">全部</button>
                    <button id="filterActiveBtn" onclick="setFilter('active')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">僅顯示已填</button>
                </div>

                <button onclick="openAddItemModal()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-medium rounded-xl shadow-xs flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>新增品項</span>
                </button>
            </div>
        </div>

        <!-- Total Net Weight Dynamic Banner -->
        <div id="totalSummaryBanner" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl p-3.5 mb-4 flex items-center justify-between shadow-xs">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-scale-balanced text-emerald-600 text-lg"></i>
                <span class="text-sm font-medium">目前已登記品項總淨重：</span>
            </div>
            <div class="text-lg font-bold text-emerald-700">
                <span id="bannerTotalNetWeight">0.00</span> kg
            </div>
        </div>

        <!-- Items Dynamic Cards Grid -->
        <div id="app" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
            <!-- Dynamic items rendered by JavaScript -->
        </div>

        <!-- Empty State Message -->
        <div id="emptyState" class="hidden py-12 text-center">
            <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                🔍
            </div>
            <h3 class="text-base font-semibold text-slate-700">找不到相符的品項</h3>
            <p class="text-xs text-slate-400 mt-1">請嘗試變更搜尋關鍵字，或點擊上方「新增品項」。</p>
        </div>

    </main>

    <!-- Floating Action Buttons -->
    <div class="fixed bottom-5 right-5 flex flex-col gap-3 z-20">
        <button onclick="copy()" 
                title="複製計算結果"
                class="w-14 h-14 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-full shadow-lg flex items-center justify-center text-xl transition-all duration-200 border-2 border-white">
            <i class="fa-regular fa-copy"></i>
        </button>

        <button onclick="confirmClearData()" 
                title="清空所有資料"
                class="w-14 h-14 bg-red-500 hover:bg-red-600 active:scale-95 text-white rounded-full shadow-lg flex items-center justify-center text-xl transition-all duration-200 border-2 border-white">
            <i class="fa-solid fa-trash-can"></i>
        </button>
    </div>

    <!-- Modal: Add New Custom Item -->
    <div id="addItemModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl border border-slate-100 transition-all">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <span>➕</span> 新增自訂品項
                </h3>
                <button onclick="closeAddItemModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">品項名稱 <span class="text-red-500">*</span></label>
                    <input id="modalName" type="text" placeholder="例如：本產高麗菜" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">單一箱/籃重 (kg) <span class="text-red-500">*</span></label>
                    <input id="modalTare" type="number" step="any" placeholder="例如：1.2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">圖示/Emoji (選填)</label>
                    <input id="modalIcon" type="text" placeholder="例如：🥬 或 🥦" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeAddItemModal()" class="px-4 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition">取消</button>
                <button onclick="handleAddFromModal()" class="px-5 py-2 text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl text-sm font-medium shadow-xs transition">儲存品項</button>
            </div>
        </div>
    </div>

    <!-- Modal: Confirmation Dialog -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl border border-slate-100 text-center">
            <div id="confirmIcon" class="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                ⚠️
            </div>
            <h3 id="confirmTitle" class="text-base font-bold text-slate-800">確認清空所有資料？</h3>
            <p id="confirmMessage" class="text-xs text-slate-500 mt-1 mb-5">包含已輸入的重量與件數紀錄，此操作無法撤銷。</p>

            <div class="flex gap-2">
                <button id="confirmCancelBtn" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-xl transition">取消</button>
                <button id="confirmOkBtn" class="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-medium text-sm rounded-xl transition">確定清空</button>
            </div>
        </div>
    </div>

    <!-- Modal: Summary Report Modal -->
    <div id="summaryModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-xl border border-slate-100 flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    📋 已填報表資料預覽
                </h3>
                <button onclick="toggleSummaryModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="summaryContent" class="flex-grow overflow-y-auto custom-scrollbar font-mono text-xs bg-slate-50 p-3 rounded-xl border border-slate-200 whitespace-pre-wrap text-slate-700">
                <!-- Injected via JS -->
            </div>

            <div class="flex justify-between items-center gap-2 mt-4 pt-2 border-t border-slate-100">
                <button onclick="toggleSummaryModal()" class="px-4 py-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl text-xs sm:text-sm font-medium transition">關閉</button>
                <button onclick="copyFromSummaryModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs sm:text-sm font-medium shadow-xs transition flex items-center gap-1.5">
                    <i class="fa-regular fa-copy"></i>
                    <span>複製報表內文</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-1/2 translate-x-1/2 sm:translate-x-0 sm:right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Constants & Storage Keys (Preserved as requested)
        const PALLET = 8.2;
        const STORAGE_DATA = "data_fixed_v1";
        const STORAGE_ITEMS = "customItems_fixed_v1";

        function createItem(name, tare, icon="", id=null){
            return {
                id: id || crypto.randomUUID(),
                name,
                tare,
                icon
            };
        }

        // Default item set (23 original items)
        const defaultItems = [
            createItem("日本山藥(無填充物)", 0.73, "🥔", "item1"),
            createItem("小豆苗", 1.2, "🌿", "item2"),
            createItem("苜蓿", 0.89, "🌱", "item3"),
            createItem("興家洋菇", 0.65, "🍄", "item4"),
            createItem("歐式生菜(土耕-黑苔裝)", 1.8, "🌱🥬", "item5"),
            createItem("歐式生菜(水耕-紙箱裝)", 1.49, "💧🥬", "item6"),
            createItem("本產美生菜", 1.45, "🥬", "item7"),
            createItem("本產蘿美(牛皮紙箱)", 1.51, "🥬", "item8"),
            createItem("本產蘿美(白箱)", 1.42, "🥬", "item9"),
            createItem("進口美生菜［美國］", 1.22, "📦🥬", "item10"),
            createItem("進口美生菜［越南］", 0.83, "🟢📦🥬", "item11"),
            createItem("進口美生菜［韓國］", 1.17, "🔴📦🥬", "item12"),
            createItem("進口美生菜［馬來西亞］", 1.22, "📦🥬", "item13"),    
            createItem("進口蘿美(大包)", 1.06, "🖐️🥬", "item14"),
            createItem("進口蘿美(小包)", 1.51, "✊🥬", "item15"),
            createItem("本產紫高麗菜", 1.22, "🟣🥬", "item16"),
            createItem("進口紫高麗菜", 0.73, "🟣🥬", "item17"),
            createItem("小黃瓜/番茄黑苔", 1.55, "🥒🍅", "item18"),
            createItem("小番茄", 0.7, "🍅", "item19"),
            createItem("辣椒", 1.2, "🌶️", "item20"),
            createItem("櫛瓜", 0.84, "🥒", "item21"),
            createItem("日本紅春香地瓜", 0.45, "🍠", "item22"),
            createItem("日本大蔥", 0.45, "🧅", "item23"),
            createItem("阿成南瓜(藍苔)", 2.38, "🎃", "item24"),
            createItem("栗子南瓜(家福苔)", 3.13, "🌰🎃", "item25"),
            createItem("金霜玉米(藍苔)", 2.38, "🌽", "item26"),   
        ];

        let savedItems = JSON.parse(localStorage.getItem(STORAGE_ITEMS)) || [];
        let items = [...defaultItems, ...savedItems];
        let data = JSON.parse(localStorage.getItem(STORAGE_DATA)) || {};
        let currentFilter = 'all'; // 'all' or 'active'

        // 判斷是否為生菜/高麗菜分類 (item5 ~ item17)
        function isGreenCategory(id) {
            const match = /^item(\d+)$/.exec(id);
            if (match) {
                const num = parseInt(match[1], 10);
                return num >= 5 && num <= 17;
            }
            return false;
        }

        // 自動在前面新增「本產」、「進口」彩色高亮標籤，原本文字完整保留
        function formatItemName(name) {
            let badgesHtml = '';

            // 檢查並新增 本產 標籤
            if (name.includes("本產")) {
                badgesHtml += `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold bg-emerald-700 text-white shadow-2xs mr-1.5"><i class="fa-solid fa-leaf text-[10px] mr-1"></i>本產</span>`;
            }
            
            // 檢查並新增 進口 標籤
            if (name.includes("進口")) {
                badgesHtml += `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-bold bg-blue-600 text-white shadow-2xs mr-1.5"><i class="fa-solid fa-plane-arrival text-[10px] mr-1"></i>進口</span>`;
            }

            return `<span class="inline-flex flex-wrap items-center gap-y-1">${badgesHtml}<span class="align-middle">${name}</span></span>`;
        }

        // Save state to local storage
        function save(){
            localStorage.setItem(STORAGE_ITEMS, JSON.stringify(savedItems));
            localStorage.setItem(STORAGE_DATA, JSON.stringify(data));
        }

        window.addEventListener("beforeunload", save);

        // Toast Notification System
        function showToast(msg, type = "info") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            
            const bgColor = type === "error" ? "bg-red-600" : type === "success" ? "bg-emerald-600" : "bg-slate-800";
            
            toast.className = `${bgColor} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 transform transition-all duration-300 pointer-events-auto opacity-0 translate-y-2`;
            toast.innerHTML = `<span>${msg}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove("opacity-0", "translate-y-2");
            }, 10);

            setTimeout(() => {
                toast.classList.add("opacity-0", "-translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Fuzzy search logic
        function fuzzyMatch(name, keyword){
            if(!keyword) return true;
            name = name.toLowerCase();
            keyword = keyword.toLowerCase().trim().replace(/\s+/g, "");

            let i = 0;
            for(let char of name){
                if(char === keyword[i]) i++;
                if(i === keyword.length) return true;
            }
            return false;
        }

        // Main Render Function
        function render(){
            const app = document.getElementById("app");
            const emptyState = document.getElementById("emptyState");
            app.innerHTML = "";

            const keyword = document.getElementById("search")?.value || "";
            const clearBtn = document.getElementById("clearSearchBtn");
            if(clearBtn) clearBtn.classList.toggle("hidden", !keyword);

            let visibleCount = 0;
            let totalNetWeightSum = 0;
            let activeItemCount = 0;

            items.forEach((item) => {
                const d = data[item.id] || {};
                const isCustom = savedItems.some(x => x.id === item.id);

                const hasWeight = d.weight !== undefined && d.weight !== "";
                const hasCount = d.count !== undefined && d.count !== "";
                const hasPallet = d.pallet === 1;
                const isActive = hasWeight || hasCount || hasPallet;

                if (isActive) activeItemCount++;

                // Filter logic
                if (currentFilter === 'active' && !isActive) return;
                if (!fuzzyMatch(item.name, keyword)) return;

                visibleCount++;

                const weight = parseFloat(d.weight) || 0;
                const count = parseFloat(d.count) || 0;
                const palletWeight = (d.pallet == 1) ? PALLET : 0;
                const deduction = (item.tare * count) + palletWeight;
                let result = weight - deduction;
                if (result < 0) result = 0;

                const invalidPair = (hasWeight && !hasCount) || (!hasWeight && hasCount);
                const isWarning = weight < deduction || invalidPair;

                if (hasWeight && hasCount && !invalidPair) {
                    totalNetWeightSum += result;
                }

                // 檢查是否屬於 item5~item17 綠色分類
                const isGreenGroup = isGreenCategory(item.id);

                // Card Container Element
                const card = document.createElement("div");
                let cardClass = "rounded-2xl p-4 border shadow-xs transition-all flex flex-col justify-between ";
                
                if (isActive) {
                    cardClass += isWarning ? "card-error" : "card-active";
                } else if (isGreenGroup) {
                    // item5-17 專屬綠色底色與邊框
                    cardClass += "bg-emerald-100/70 border-emerald-300/90 hover:border-emerald-400";
                } else {
                    cardClass += "bg-white border-slate-200/80";
                }
                
                card.className = cardClass;
                card.id = "card" + item.id;

                let jinText = "";
                if (item.name.includes("小豆苗") || item.name.includes("苜蓿")) {
                    let jin = result / 0.6;
                    jinText = `<span class="text-slate-500 font-normal text-xs sm:text-sm"> (${jin.toFixed(2)}台斤)</span>`;
                }

                let resultDisplayHtml = "";
                if (invalidPair) {
                    resultDisplayHtml = `<span class="text-amber-600 text-xs sm:text-sm font-semibold flex items-center gap-1">⚠️ 總重與件數需同時輸入</span>`;
                } else if (hasWeight && hasCount) {
                    resultDisplayHtml = `
                        <div class="flex items-baseline justify-between flex-wrap gap-1">
                            <span class="text-xs text-slate-500">實秤淨重:</span>
                            <span class="text-lg sm:text-xl font-extrabold text-emerald-700">${result.toFixed(2)} <span class="text-xs font-semibold text-slate-600">kg</span>${jinText}</span>
                        </div>
                        ${isWarning ? '<p class="text-xs font-semibold text-red-500 mt-0.5">⚠️ 重量異常 (扣重超標)</p>' : ''}
                    `;
                } else {
                    resultDisplayHtml = `<span class="text-xs text-slate-400 font-normal">等待輸入總重與件數...</span>`;
                }

                // 輸入框背景色設定（綠色卡片使用白色輸入框以利清晰對比）
                const inputBgClass = isGreenGroup && !isActive ? "bg-white" : "bg-slate-50";

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <h2 class="font-bold text-slate-800 text-base leading-snug flex items-center flex-wrap gap-1">
                                ${item.icon ? `<span class="mr-1 text-lg">${item.icon}</span>` : ''}${formatItemName(item.name)}
                            </h2>
                            ${isCustom ? `
                                <button onclick="deleteItem('${item.id}')" class="text-red-400 hover:text-red-600 text-xs px-1.5 py-0.5 rounded-lg hover:bg-red-50 transition" title="刪除品項">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            ` : ''}
                        </div>

                        <!-- Inputs Grid -->
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">總重 (kg)</label>
                                <input type="number" min="0" step="any"
                                    placeholder="0.0" 
                                    value="${d.weight !== undefined ? d.weight : ''}"
                                    class="w-full px-2.5 py-1.5 ${inputBgClass} border border-slate-200/90 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium shadow-2xs"
                                    oninput="update('${item.id}', 'weight', this.value)">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">件數 (件)</label>
                                <input type="number" min="1" step="1"
                                    placeholder="0" 
                                    value="${d.count !== undefined ? d.count : ''}"
                                    class="w-full px-2.5 py-1.5 ${inputBgClass} border border-slate-200/90 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium shadow-2xs"
                                    oninput="update('${item.id}', 'count', this.value)">
                            </div>
                        </div>

                        <!-- Pallet Radio Group -->
                        <div class="mb-3 ${isGreenGroup && !isActive ? 'bg-white/80' : 'bg-slate-50/80'} p-2 rounded-xl border border-slate-100 flex items-center justify-around text-xs">
                            <label class="flex items-center gap-1.5 cursor-pointer select-none">
                                <input type="radio" name="pallet-${item.id}"
                                    class="accent-emerald-600 w-4 h-4 cursor-pointer"
                                    ${d.pallet == 0 || d.pallet === undefined ? "checked" : ""}
                                    onchange="update('${item.id}', 'pallet', 0)">
                                <span>綠園板 0 塊</span>
                            </label>

                            <label class="flex items-center gap-1.5 cursor-pointer select-none">
                                <input type="radio" name="pallet-${item.id}"
                                    class="accent-emerald-600 w-4 h-4 cursor-pointer"
                                    ${d.pallet == 1 ? "checked" : ""}
                                    onchange="update('${item.id}', 'pallet', 1)">
                                <span class="font-medium text-emerald-800">綠園板 1 塊 (+8.2kg)</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <div class="text-[11px] text-slate-500 border-t border-slate-200/60 pt-2 flex items-center justify-between mb-1.5">
                            <span>預設單重：<strong class="text-slate-700">${item.tare}</strong> kg/件</span>
                        </div>
                        <div class="bg-white/90 rounded-xl p-2 border border-slate-100 shadow-2xs">
                            ${resultDisplayHtml}
                        </div>
                    </div>
                `;

                app.appendChild(card);
            });

            // Update Header Counter & Total Banner
            document.getElementById("activeCountBadge").innerText = activeItemCount;
            
            const totalBanner = document.getElementById("totalSummaryBanner");
            if (totalNetWeightSum > 0) {
                totalBanner.classList.remove("hidden");
                document.getElementById("bannerTotalNetWeight").innerText = totalNetWeightSum.toFixed(2);
            } else {
                totalBanner.classList.add("hidden");
            }

            // Show Empty State if empty
            emptyState.classList.toggle("hidden", visibleCount > 0);
        }

        function update(id, key, val){
            if(key === "weight" || key === "count"){
                let num = parseFloat(val);
                if(key === "count") num = Math.floor(num);

                if(isNaN(num) || num <= 0){
                    val = "";
                } else {
                    val = num;
                }
            }

            if(!data[id]) data[id] = {};
            data[id][key] = val;

            save();
            render();
        }

        function setFilter(type) {
            currentFilter = type;
            const allBtn = document.getElementById("filterAllBtn");
            const activeBtn = document.getElementById("filterActiveBtn");

            if (type === 'all') {
                allBtn.className = "px-3 py-1.5 rounded-lg bg-white text-slate-800 shadow-xs font-semibold transition";
                activeBtn.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
            } else {
                activeBtn.className = "px-3 py-1.5 rounded-lg bg-white text-slate-800 shadow-xs font-semibold transition";
                allBtn.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
            }
            render();
        }

        function clearSearch() {
            const searchInput = document.getElementById("search");
            if (searchInput) {
                searchInput.value = "";
                render();
            }
        }

        // Custom Modal: Add Item
        function openAddItemModal() {
            document.getElementById("modalName").value = "";
            document.getElementById("modalTare").value = "";
            document.getElementById("modalIcon").value = "";
            document.getElementById("addItemModal").classList.remove("hidden");
        }

        function closeAddItemModal() {
            document.getElementById("addItemModal").classList.add("hidden");
        }

        function handleAddFromModal() {
            const name = document.getElementById("modalName").value.trim();
            const tare = parseFloat(document.getElementById("modalTare").value);
            const icon = document.getElementById("modalIcon").value.trim();

            if (!name) {
                showToast("請輸入品項名稱！", "error");
                return;
            }
            if (isNaN(tare) || tare <= 0) {
                showToast("請輸入正確的單一箱/籃重！", "error");
                return;
            }

            const newItem = createItem(name, tare, icon);
            savedItems.push(newItem);
            items.push(newItem);

            save();
            closeAddItemModal();
            render();
            showToast(`已新增品項：${name}`, "success");
        }

        function deleteItem(id) {
            showConfirmModal("刪除品項", "確定要刪除這個自訂品項嗎？", () => {
                savedItems = savedItems.filter(item => item.id !== id);
                items = items.filter(item => item.id !== id);
                delete data[id];
                save();
                render();
                showToast("已刪除該自訂品項", "info");
            });
        }

        // Custom Confirm Modal Handler
        function showConfirmModal(title, msg, onConfirm) {
            const modal = document.getElementById("confirmModal");
            document.getElementById("confirmTitle").innerText = title;
            document.getElementById("confirmMessage").innerText = msg;

            const okBtn = document.getElementById("confirmOkBtn");
            const cancelBtn = document.getElementById("confirmCancelBtn");

            const close = () => modal.classList.add("hidden");

            okBtn.onclick = () => {
                close();
                if (onConfirm) onConfirm();
            };
            cancelBtn.onclick = close;

            modal.classList.remove("hidden");
        }

        function confirmClearData() {
            showConfirmModal("確認清空所有資料？", "將會清除目前所有已輸入的重量與件數資料，此動作無法復原。", () => {
                data = {};
                localStorage.removeItem(STORAGE_DATA);
                save();
                render();
                showToast("所有輸入資料已完全清空！", "info");
            });
        }

        function generateReportText() {
            let text = "";
            let totalNet = 0;

            items.forEach((item) => {
                const d = data[item.id];
                if (!d || !d.count || !d.weight) return;

                let weight = parseFloat(d.weight) || 0;
                let count = parseFloat(d.count) || 0;
                let pallet = (d.pallet == 1) ? PALLET : 0;

                let result = weight - (item.tare * count) - pallet;
                if (result < 0) result = 0;
                totalNet += result;

                let jinText = "";
                if (item.name.includes("小豆苗") || item.name.includes("苜蓿")) {
                    let jin = result / 0.6;
                    jinText = ` (${jin.toFixed(2)}台斤)`;
                }

                text += `${item.name} ${count}件\n`;
                text += `實秤：${weight} - (${item.tare}×${count})`;

                if (pallet) {
                    text += ` - ${PALLET}`;
                }

                text += ` = ${result.toFixed(2)}kg${jinText}\n\n`;
            });

            if (text) {
                text += `------------------------\n`;
                text += `📊 當前報表總計淨重：${totalNet.toFixed(2)} kg\n`;
            }

            return text;
        }

        function copy() {
            const reportText = generateReportText();
            if (!reportText) {
                showToast("目前沒有可複製的完成資料！", "error");
                return;
            }

            copyToClipboard(reportText);
        }

        function toggleSummaryModal() {
            const modal = document.getElementById("summaryModal");
            const content = document.getElementById("summaryContent");
            const isHidden = modal.classList.contains("hidden");

            if (isHidden) {
                const reportText = generateReportText();
                content.innerText = reportText || "尚未輸入任何品項資料。";
                modal.classList.remove("hidden");
            } else {
                modal.classList.add("hidden");
            }
        }

        function copyFromSummaryModal() {
            const reportText = generateReportText();
            if (!reportText) {
                showToast("目前沒有可複製的報表內容！", "error");
                return;
            }
            copyToClipboard(reportText);
            toggleSummaryModal();
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("已成功複製至剪貼簿！", "success");
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("已成功複製至剪貼簿！", "success");
            } catch (err) {
                showToast("複製失敗，請手動複製！", "error");
            }
            document.body.removeChild(textArea);
        }

        function checkLastData(){
            let hasData = Object.values(data).some(d => 
                d && (d.weight || d.count || d.pallet !== undefined)
            );

            if(hasData){
                setTimeout(() => {
                    showToast("已自動為您載入上次留存的資料", "info");
                }, 500);
            }
        }

        // Initialize Application
        window.onload = function() {
            render();
            checkLastData();
        };
    </script>
</body>
</html>
